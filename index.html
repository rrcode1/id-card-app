<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My ID Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>

  <div class="topbar">
    <a href="edit.html" class="tab">Edit</a>
  </div>

  <div id="viewPage">

    <div class="card">
      <div class="header" id="bannerAreaView">
        <div class="logo-area" id="logoAreaView">
          <img id="viewLogo" src="" alt="Logo" style="display:none;">
        </div>
        <h1>MY ID CARD</h1>
      </div>

      <div class="card-body">
        <div class="photo-area">
          <img id="viewPhoto" src="" alt="Your photo" style="display:none;">
          <span id="viewPhotoPlaceholder">No photo</span>
        </div>

        <div class="fields">
          <div class="display-field">
            <span class="display-label">ID Number</span>
            <span id="viewIdNumber" class="display-value">—</span>
          </div>
          <div class="display-field">
            <span class="display-label">Date of Birth</span>
            <span id="viewDob" class="display-value">—</span>
          </div>
          <div class="display-field">
            <span class="display-label">Name</span>
            <span id="viewName" class="display-value">—</span>
          </div>
          <div class="display-field">
            <span class="display-label">Address</span>
            <span id="viewAddress" class="display-value">—</span>
          </div>
          <div class="display-field">
            <span class="display-label">Expiry Date</span>
            <span id="viewExpiry" class="display-value">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card extra-card">
      <div class="subheader">Additional Details</div>
      <div class="card-body-column">
        <div class="display-field">
          <span class="display-label">Email</span>
          <span id="viewEmail" class="display-value">—</span>
        </div>
        <div class="display-field">
          <span class="display-label">Phone Number</span>
          <span id="viewPhone" class="display-value">—</span>
        </div>
        <div class="display-field">
          <span class="display-label">Family Name</span>
          <span id="viewFamilyName" class="display-value">—</span>
        </div>
        <div class="display-field">
          <span class="display-label">Conditions</span>
          <span id="viewConditions" class="display-value">—</span>
        </div>
        <div class="extra-image-area barcode">
          <img id="viewBarcode" src="" alt="Barcode" style="display:none;">
          <span id="viewBarcodePlaceholder">No image added</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
